<h2>"我密码" 外观风格</h2>
<p class="subtitle">选一个你喜欢的整体视觉方向，后续所有界面都按这个风格来设计。</p>

<div class="options">
  <div class="option" data-choice="light" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>简洁浅色</h3>
      <p>白/灰色为主，蓝色点缀。干净清爽，像 Apple Notes、Notion 的风格。</p>
    </div>
  </div>

  <div class="option" data-choice="dark" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>专业深色</h3>
      <p>深灰/黑色背景，亮色文字。护眼省电，像 1Password、GitHub Dark 的风格。</p>
    </div>
  </div>

  <div class="option" data-choice="auto" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>自动切换（推荐）</h3>
      <p>跟随系统设置，白天自动浅色、晚上自动深色。给用户最大自由，两种风格都做好。</p>
    </div>
  </div>
</div>
